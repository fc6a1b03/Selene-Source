name: selene
description: "基于 MoonTV 的视频播放器"
# 如需发布到 pub.dev 请删除此行
publish_to: 'none'
# 版本号: 版本+构建号
version: 1.6.6+2156
environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ====================
  # 集合工具
  # ====================
  collection: ^1.18.0
  # ====================
  # 状态管理
  # ====================
  provider: ^6.1.2
  # ====================
  # 视频播放
  # ====================
  media_kit: 1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  pip: ^0.0.3  # iOS PiP
  floating: ^6.0.0  # Android PiP
  # ====================
  # 数据存储
  # ====================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # ====================
  # 网络请求
  # ====================
  dio: ^5.4.0
  http: ^1.2.1
  # ====================
  # UI 组件与图标
  # ====================
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.0
  gpt_markdown: ^1.1.4
  lucide_icons_flutter: ^3.1.0
  # ====================
  # 平台功能
  # ====================
  # Android / iOS / 桌面端
  app_settings: ^7.0.0
  gal: ^2.3.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.3
  screen_brightness: ^2.1.7
  url_launcher: ^6.3.0
  volume_controller: ^3.4.0
  # Windows
  bitsdojo_window: ^0.1.6
  # macOS
  macos_window_utils: ^1.5.1
  # ====================
  # 工具库
  async: ^2.13.0
  # ====================
  encrypt: ^5.0.3
  flutter_cache_manager: ^3.4.1
  gbk_codec: ^0.4.0
  intl: ^0.20.2
  path: ^1.9.1
  xml: ^6.5.0
  # ====================
  # 加密与编码
  # ====================
  bs58check: ^1.0.2
  # ====================
  # USB 摄像头
  # ====================
  flutter_uvc_camera: ^0.0.4
  # ====================
  # 投屏功能
  # ====================
  dlna_dart: ^0.1.0
  # ====================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true
# ====================
# 应用图标配置
# ====================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo.png"
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#FFFFFF"
    theme_color: "#2196F3"
  windows:
    generate: true
    image_path: "logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "logo.png"
